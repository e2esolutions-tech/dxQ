[package]
name        = "ree0xq-net-ebpf"
version     = "0.1.0-dev"
edition     = "2021"
rust-version = "1.78"
license     = "MIT"
description = "ree0xQ Phase 2.1 — kernel-side eBPF program (TC classifier) that captures TLS handshake bytes off the wire and pushes them to a ring buffer for the userspace loader in ree0xq-net."

# This crate is intentionally NOT a workspace member of the parent
# Cargo.toml — it compiles to the BPF target (`bpfel-unknown-none`),
# requires a nightly toolchain and `bpf-linker`, and is loaded into
# the kernel at runtime by the userspace bin in `crates/ree0xq-net`
# under the `live-interface` feature.
#
# Build the BPF object:
#   rustup target add bpfel-unknown-none --toolchain nightly
#   cargo install bpf-linker
#   cargo +nightly build -Z build-std=core --release \
#         --target bpfel-unknown-none
#
# The userspace loader looks for the resulting object at
#   target/bpfel-unknown-none/release/ree0xq-net-ebpf
# unless the operator overrides via `REE0XQ_NET_EBPF_OBJECT=<path>`.

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# eBPF runtime + helpers
aya-ebpf  = "0.1"
aya-log-ebpf = "0.1"
# no_std utilities for the in-kernel parser
network-types = "0.0.6"

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = true
panic = "abort"
incremental = false
codegen-units = 1
rpath = false

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
