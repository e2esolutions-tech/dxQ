id: r4-stale-psk
description: "R4 — stale PSK: emulator continues producing keys at low QBER while the SAE-side rotation is suppressed externally. ree0xQ should observe `psk_age_seconds` rising past policy."
duration_seconds: 3600
events:
  - at_seconds: 0
    op: { op: set_qber, qber: 0.018 }
  - at_seconds: 0
    op: { op: set_key_rate, rate_bps: 12000 }
# Scenario drives no QBER/rate changes — staleness is measured by the
# SAE/observer; the emulator only confirms that a healthy KME alone
# is insufficient evidence of session-level QKD protection.
