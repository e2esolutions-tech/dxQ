[package]
name        = "ree0xq-qkd"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "ree0xQ QKD agent: ETSI GS QKD 014 collector + reference KME emulator"

[dependencies]
ree0xq-core   = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
tokio        = { workspace = true }
anyhow       = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
chrono       = { workspace = true }
uuid         = { workspace = true }
axum         = { workspace = true }
tower        = { workspace = true }
reqwest      = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand         = "0.8"
clap         = { version = "4", features = ["derive"] }
serde_yaml   = "0.9"
tracing-subscriber = { workspace = true }

# Reference KME emulator — runnable standalone.
[[bin]]
name = "ree0xq-qkd-kme-emulator"
path = "src/bin/kme_emulator.rs"

# Collector — polls one or more KMEs and emits crypto_inventory_event.
[[bin]]
name = "ree0xq-qkd"
path = "src/bin/collector.rs"

# Replay driver — drives a running emulator through a replay scenario.
[[bin]]
name = "ree0xq-qkd-replay"
path = "src/bin/replay.rs"
