[package]
name        = "dxq-desktop"
version     = "0.1.0-dev"
edition     = "2021"
rust-version = "1.78"
license     = "MIT"
description = "dxQ desktop monitor — a native (egui/eframe) client for the dxQ collector REST API."

# Intentionally NOT a workspace member of the parent Cargo.toml: it
# pulls the eframe/winit/glow GUI stack, which needs X11/Wayland + GL
# dev libraries to link and cannot run headless. Keeping it a separate
# workspace keeps `cargo build --workspace` and CI (which have no
# display libraries) clean. Build it explicitly:
#   cd crates/dxq-desktop && cargo run -- --collector http://127.0.0.1:8090
[workspace]

[[bin]]
name = "dxq-desktop"
path = "src/main.rs"

[dependencies]
dxq-core    = { path = "../dxq-core" }
eframe      = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
clap        = { version = "4", features = ["derive", "env"] }
# REST client. rustls with webpki roots but NO bundled crypto
# provider — main() installs the `ring` provider as the process
# default, matching dxq-server and staying off OpenSSL/aws-lc-sys.
reqwest     = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots-no-provider"] }
rustls      = { version = "0.23", default-features = false, features = ["ring"] }
