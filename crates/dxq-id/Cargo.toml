[package]
name        = "dxq-id"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "dxQ HSM / KMS / smart-card inventory (V4 — offline + PKCS#11 + AWS KMS)"

[lib]
name = "dxq_id"
path = "src/lib.rs"

[[bin]]
name = "dxq-id"
path = "src/bin/dxq_id.rs"

[dependencies]
dxq-core         = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
chrono             = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
clap               = { version = "4", features = ["derive"] }
# Collector POST. Same blocking shape as dxq-cert / dxq-chain.
reqwest            = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[features]
default = []
# V4.1 PKCS#11 — gated because cryptoki + a vendor PKCS#11
# library are needed at run time. Operators enable when they
# actually want the backend.
pkcs11 = ["dep:cryptoki"]
# V4.2 cloud KMS (AWS) — gated to keep aws-sdk-kms compile
# time off the default build.
aws-kms = ["dep:aws-config", "dep:aws-sdk-kms", "dep:tokio", "dep:async-trait"]

[dependencies.cryptoki]
version  = "0.7"
optional = true

[dependencies.aws-config]
version  = "1"
optional = true

[dependencies.aws-sdk-kms]
version  = "1"
optional = true

[dependencies.tokio]
workspace = true
optional  = true

[dependencies.async-trait]
version  = "0.1"
optional = true

[dev-dependencies]
tempfile     = "3"
# In-process collector smoke (matches dxq-chain / dxq-cert).
dxq-server = { workspace = true }
axum         = { workspace = true }
tokio        = { workspace = true }

[package.metadata.deb]
maintainer = "e2e Solutions <info@e2esolutions.tech>"
copyright = "2025-2026 e2e Solutions"
license-file = ["../../LICENSE", "0"]
extended-description = "HSM / KMS / smart-card inventory agent. Offline classifier plus PKCS#11 and AWS KMS backends; emits one crypto_inventory_event per discovered key slot."
section = "net"
priority = "optional"
depends = "$auto"
assets = [
  ["target/release/dxq-id", "usr/local/bin/", "755"],
  ["../../dist/systemd/dxq-id-inventory.service", "lib/systemd/system/", "644"],
  ["../../dist/systemd/dxq-id-inventory.timer", "lib/systemd/system/", "644"],
]
systemd-units = { unit-name = "dxq-id-inventory", enable = false, start = false }

[package.metadata.generate-rpm]
name = "dxq-id"
version = "0.1.0~dev"
license = "MIT"
summary = "dxQ HSM / KMS / smart-card inventory agent"
assets = [
  { source = "target/release/dxq-id", dest = "/usr/local/bin/dxq-id", mode = "755" },
  { source = "dist/systemd/dxq-id-inventory.service", dest = "/usr/lib/systemd/system/dxq-id-inventory.service", mode = "644" },
  { source = "dist/systemd/dxq-id-inventory.timer", dest = "/usr/lib/systemd/system/dxq-id-inventory.timer", mode = "644" },
]
post_install_script = "systemctl daemon-reload || true"
pre_uninstall_script = "systemctl disable --now dxq-id-inventory.timer 2>/dev/null || true"
