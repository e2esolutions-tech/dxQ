[package]
name        = "sezar-cert"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "Sezar certificate inventory module (V2 — host-scan, CT-scan, vault-scan)"

[lib]
name = "sezar_cert"
path = "src/lib.rs"

[[bin]]
name = "sezar-cert"
path = "src/bin/sezar_cert.rs"

[dependencies]
sezar-core         = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
chrono             = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
clap               = { version = "4", features = ["derive"] }
# Cert parsing + walking. x509-parser brings its own pem
# submodule (Pem::read iterator) so we don't need a separate
# `pem` crate alongside it.
x509-parser        = "0.16"
walkdir            = "2"
hex                = "0.4"
sha2               = "0.10"
# Collector POST. Blocking client keeps the binary's main path
# synchronous; matches sezar-net's Sink pattern.
reqwest            = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
# rcgen mints self-signed certs the parser tests load. Same
# crate sezar-server uses for its CA path.
rcgen    = { version = "0.13", default-features = false, features = ["pem", "ring"] }
# End-to-end smoke: spin sezar-server's router in-process and
# round-trip events through it.
sezar-server = { workspace = true }
axum         = { workspace = true }
tokio        = { workspace = true }
