[package]
name        = "sezar-net"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "Sezar network module — TLS / SSH / IPsec ciphersuite observation via eBPF"

[lib]
name = "sezar_net"
path = "src/lib.rs"

[dependencies]
sezar-core         = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
chrono             = { workspace = true }
clap               = { version = "4", features = ["derive"] }
hex                = "0.4"
reqwest            = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# PQ-capable probe (Phase 1.5). rustls 0.23 + rustls-post-quantum
# registers the X25519MLKEM768 hybrid group on a custom CryptoProvider.
rustls             = "0.23"
rustls-post-quantum = "0.2"
tokio-rustls       = "0.26"
rustls-pki-types   = "1"
webpki-roots       = "0.26"
x509-parser        = "0.16"

[dev-dependencies]
# (none — every dep needed for tests lives in [dependencies] already)

# Phase-1 binary: pipe zgrab2 JSON output into crypto_inventory_event records.
# Phase 2 (eBPF live observation) lands in #SEZ-3 and adds aya deps.
[[bin]]
name = "sezar-net"
path = "src/bin/sezar_net.rs"
