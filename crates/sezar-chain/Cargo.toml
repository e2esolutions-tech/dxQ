[package]
name        = "sezar-chain"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "Sezar blockchain crypto monitor (V3 — Bitcoin / Ethereum / QRL address inventory)"

[lib]
name = "sezar_chain"
path = "src/lib.rs"

[[bin]]
name = "sezar-chain"
path = "src/bin/sezar_chain.rs"

[dependencies]
sezar-core         = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
chrono             = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
clap               = { version = "4", features = ["derive"] }
# Collector POST. Same blocking pattern as sezar-cert.
reqwest            = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tempfile     = "3"
# In-process collector smoke.
sezar-server = { workspace = true }
axum         = { workspace = true }
tokio        = { workspace = true }
