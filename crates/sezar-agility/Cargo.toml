[package]
name        = "sezar-agility"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "Sezar crypto-agility scanner: classifies assets on a five-level ordinal scale from static analysis"

[dependencies]
sezar-core   = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
serde_yaml   = "0.9"
anyhow       = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
walkdir      = "2"
regex        = "1"
clap         = { version = "4", features = ["derive"] }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile           = "3"

[[bin]]
name = "sezar-agility"
path = "src/bin/agility.rs"
