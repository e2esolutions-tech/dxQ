[package]
name        = "sezar-server"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "Sezar collector + REST API + dashboard backend"

[lib]
name = "sezar_server"
path = "src/lib.rs"

[[bin]]
name = "sezar-server"
path = "src/main.rs"

[dependencies]
sezar-core         = { workspace = true }
sezar-agility      = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tokio              = { workspace = true }
axum               = { workspace = true }
tower              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }
chrono             = { workspace = true }
dashmap            = "6"
async-trait        = "0.1"
clap               = { version = "4", features = ["derive", "env"] }
# Postgres persistence (SEZ-2). sqlx + the tokio-rustls runtime
# (matches the rest of the workspace's TLS surface); chrono +
# uuid + json features round-trip the schema fields we use.
sqlx               = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "macros", "migrate"] }
# mTLS bootstrap (SEZ-6): pure-Rust CA + agent cert minting,
# UUID-based bootstrap tokens, base64 for header transport of
# the optional admin secret.
rcgen              = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"] }
# `time` is pulled in transitively via rcgen; we use it directly
# for cert validity windows.
time               = "0.3"
uuid               = { workspace = true }
parking_lot        = "0.12"
# TLS termination + mTLS enforcement (SEZ-6, second half).
# axum-server wraps the rustls listener; we pick the ring crypto
# provider explicitly (default-features off) so the build is
# deterministic and stays off OpenSSL.
axum-server        = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls             = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile     = "2"
tokio-rustls       = { version = "0.26", default-features = false, features = ["ring"] }
x509-parser        = "0.16"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
# Postgres integration tests (SEZ-2). testcontainers spins up a
# disposable postgres:16 container scoped to the test run; the
# test skips cleanly when docker isn't reachable.
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }

# Debian package metadata. `cargo deb -p sezar-server` writes
# target/debian/sezar-server_<ver>_<arch>.deb. The systemd unit
# is installed alongside the binary so the operator's only
# bring-up step is `systemctl enable --now sezar-server` after a
# drop-in with SEZAR_DATABASE_URL + SEZAR_ADMIN_TOKEN.
[package.metadata.deb]
maintainer = "e2e Solutions <info@e2esolutions.tech>"
copyright = "2025-2026 e2e Solutions"
license-file = ["../../LICENSE", "0"]
extended-description = "Receives crypto_inventory_event records from sezar-net, sezar-cert, sezar-chain and sezar-id agents over mTLS, persists them (in-memory or PostgreSQL), and serves the inventory / posture / recommendations / agility endpoints plus the React dashboard."
section = "net"
priority = "optional"
depends = "$auto, adduser"
assets = [
  ["target/release/sezar-server", "usr/local/bin/", "755"],
  ["../../dist/systemd/sezar-server.service", "lib/systemd/system/", "644"],
  ["../../docs/operator-deploy.md", "usr/share/doc/sezar-server/", "644"],
]
maintainer-scripts = "../../dist/deb/sezar-server/"
systemd-units = { unit-name = "sezar-server", enable = false, start = false }

# RPM package metadata. `cargo generate-rpm -p sezar-server`
# produces target/generate-rpm/sezar-server-<ver>-1.<arch>.rpm.
# Paths are root-relative because cargo-generate-rpm runs from
# the workspace root regardless of which crate it's targeting.
[package.metadata.generate-rpm]
name = "sezar-server"
# RPM rejects `-` in versions; replace the workspace's
# `0.1.0-dev` with the RPM-friendly `0.1.0~dev`.
version = "0.1.0~dev"
license = "MIT"
summary = "Sezar collector + REST API + dashboard backend"
assets = [
  { source = "target/release/sezar-server", dest = "/usr/local/bin/sezar-server", mode = "755" },
  { source = "dist/systemd/sezar-server.service", dest = "/usr/lib/systemd/system/sezar-server.service", mode = "644" },
  { source = "docs/operator-deploy.md", dest = "/usr/share/doc/sezar-server/operator-deploy.md", mode = "644" },
]
post_install_script = "useradd -r -s /sbin/nologin sezar 2>/dev/null || true; install -d -m 0750 -o sezar -g sezar /var/lib/sezar /var/lib/sezar/ca; systemctl daemon-reload || true"
pre_uninstall_script = "systemctl disable --now sezar-server 2>/dev/null || true"
