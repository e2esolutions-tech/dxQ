[package]
name        = "sezar-server"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "Sezar collector + REST API + dashboard backend"

[lib]
name = "sezar_server"
path = "src/lib.rs"

[[bin]]
name = "sezar-server"
path = "src/main.rs"

[dependencies]
sezar-core         = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tokio              = { workspace = true }
axum               = { workspace = true }
tower              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow             = { workspace = true }
chrono             = { workspace = true }
dashmap            = "6"
clap               = { version = "4", features = ["derive", "env"] }
# mTLS bootstrap (SEZ-6): pure-Rust CA + agent cert minting,
# UUID-based bootstrap tokens, base64 for header transport of
# the optional admin secret.
rcgen              = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"] }
# `time` is pulled in transitively via rcgen; we use it directly
# for cert validity windows.
time               = "0.3"
uuid               = { workspace = true }
parking_lot        = "0.12"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
