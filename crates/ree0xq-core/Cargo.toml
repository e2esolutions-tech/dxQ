[package]
name        = "ree0xq-core"
version     = { workspace = true }
edition     = { workspace = true }
rust-version = { workspace = true }
license     = { workspace = true }
description = "ree0xQ shared event schema + posture rollup library"

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
chrono      = { workspace = true }
thiserror   = { workspace = true }
uuid        = { workspace = true }
# JSON Schema export — gated behind a feature so downstream agents
# don't pay the schema-codegen cost when they only need the structs.
schemars    = { version = "0.8", features = ["chrono"], optional = true }
# TypeScript codegen for the React UI. Same gating: dev-only artifact.
ts-rs       = { version = "10", optional = true }

[features]
default = []
# Enable when generating schema/TS artifacts (CI / docs / UI codegen).
schema   = ["dep:schemars"]
ts-types = ["dep:ts-rs"]

[[bin]]
name = "schema-export"
path = "src/bin/schema_export.rs"
required-features = ["schema"]
